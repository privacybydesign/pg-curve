name: Beta lints

# These lints are only informative, so we only run them directly on branches
# and not trial-merges of PRs, to reduce noise.
on: push

permissions: {}

jobs:
  clippy-beta:
    name: Clippy (beta)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (beta)
        run: |
          rustup toolchain install beta --profile minimal --no-self-update --component clippy
          rustup override set beta
      - name: Run Clippy (beta)
        continue-on-error: true
        run: cargo clippy --all-features --all-targets -- -W clippy::all
